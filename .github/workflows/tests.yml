name: source-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Legacy checks
        run: |
          python test_parse.py
          python test_safeguard.py
          python test_gui_tick.py
          python test_local_api.py
          python test_selftrigger.py
          python test_updater.py
          python test_singleinstance.py
      - name: Codex checks
        run: python -m unittest test_cli_routing test_codex_activity test_codex_cli test_codex_gui test_codex_app test_codex_sessions test_codex_submission test_claude_app -v

      - name: Control integration checks
        run: python -m pytest test_control_recent.py test_control_worker_scheduling.py test_native_control_choice_commit.py test_native_control_focus.py test_native_control_question_focus.py test_native_control_stop_focus.py test_codex_app_question_coexist.py test_codex_app_read_snapshot.py test_codex_context_fidelity.py test_codex_local_context.py test_codex_multiwindow.py test_codex_submission_context.py -q

      - name: One-click update checks
        run: python -m pytest test_updater_install.py -q
